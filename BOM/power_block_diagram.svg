<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111">Power-block diagram - LMS robot (ESP32 + TB6612FNG + 3S LiPo)</text>

  <!-- ========== 11.1 V rail (red) ========== -->
  <g stroke="#c0392b" stroke-width="3" fill="none">
    <line x1="170" y1="290" x2="200" y2="290"/>
    <line x1="280" y1="290" x2="320" y2="290"/>
    <line x1="320" y1="290" x2="320" y2="110"/>
    <line x1="320" y1="110" x2="350" y2="110"/>
    <line x1="430" y1="110" x2="470" y2="110" marker-end="url(#ar)"/>
    <line x1="320" y1="290" x2="320" y2="440"/>
    <line x1="320" y1="440" x2="360" y2="440" marker-end="url(#ar)"/>
  </g>
  <circle cx="320" cy="290" r="5" fill="#c0392b"/>

  <!-- Battery -->
  <rect x="20" y="250" width="150" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="95" y="274" text-anchor="middle" font-weight="bold">3S LiPo</text>
  <text x="95" y="292" text-anchor="middle">11.1 V nominal</text>
  <text x="95" y="308" text-anchor="middle">12.6 V full</text>
  <text x="95" y="324" text-anchor="middle" font-size="11">low-V alarm ~9.9 V</text>

  <!-- Switch -->
  <rect x="200" y="275" width="80" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="295" text-anchor="middle">Switch</text>
  <text x="240" y="265" text-anchor="middle" font-size="11" fill="#c0392b">XT60 (keyed)</text>

  <!-- Bulk capacitor -->
  <rect x="350" y="90" width="80" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="108" text-anchor="middle">470 uF</text>
  <text x="390" y="123" text-anchor="middle" font-size="11">25 V (to GND)</text>

  <!-- TB6612 -->
  <rect x="470" y="50" width="170" height="120" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="555" y="74" text-anchor="middle" font-weight="bold">TB6612FNG module</text>
  <text x="555" y="94" text-anchor="middle">VM = 11.1 V (spec 4.5-13.5 V)</text>
  <text x="555" y="112" text-anchor="middle">VCC = 3.3 V logic, STBY = 3V3</text>
  <text x="555" y="130" text-anchor="middle">drops ~0.5 V at 1 A</text>
  <text x="555" y="148" text-anchor="middle" font-size="11">1.0 A/channel recommended</text>

  <!-- Motors -->
  <g stroke="#c0392b" stroke-width="3" fill="none">
    <line x1="640" y1="75" x2="700" y2="75" marker-end="url(#ar)"/>
    <line x1="640" y1="145" x2="700" y2="145" marker-end="url(#ar)"/>
  </g>
  <rect x="700" y="50" width="200" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="800" y="72" text-anchor="middle" font-weight="bold">Left N20 12 V motor</text>
  <text x="800" y="90" text-anchor="middle" font-size="11">0.1 uF across terminals</text>
  <rect x="700" y="120" width="200" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="800" y="142" text-anchor="middle" font-weight="bold">Right N20 12 V motor</text>
  <text x="800" y="160" text-anchor="middle" font-size="11">0.1 uF across terminals</text>

  <!-- ========== 5 V rail (orange) ========== -->
  <rect x="360" y="410" width="150" height="60" rx="6" fill="#fff4e5" stroke="#e67e22" stroke-width="2"/>
  <text x="435" y="432" text-anchor="middle" font-weight="bold">MP1584 buck</text>
  <text x="435" y="450" text-anchor="middle">in 11.1 V, out 5.0 V</text>
  <text x="435" y="464" text-anchor="middle" font-size="11">set 5.0 V BEFORE connecting</text>
  <line x1="510" y1="440" x2="560" y2="440" stroke="#e67e22" stroke-width="3" marker-end="url(#ar)"/>
  <text x="535" y="432" text-anchor="middle" font-size="11" fill="#e67e22">5 V</text>

  <!-- ESP32 -->
  <rect x="560" y="370" width="190" height="130" rx="6" fill="#eef5ff" stroke="#2c6fbb" stroke-width="2"/>
  <text x="655" y="394" text-anchor="middle" font-weight="bold">ESP32 DevKit (30-pin)</text>
  <text x="655" y="414" text-anchor="middle">Vin = 5 V</text>
  <text x="655" y="432" text-anchor="middle">on-board regulator -> 3V3</text>
  <text x="655" y="452" text-anchor="middle" font-size="11">GPIO: PWM/direction out,</text>
  <text x="655" y="468" text-anchor="middle" font-size="11">ADC + encoder pulses in</text>

  <!-- ========== 3.3 V rail (blue) ========== -->
  <g stroke="#2c6fbb" stroke-width="3" fill="none">
    <line x1="620" y1="370" x2="620" y2="170" marker-end="url(#ar)"/>
    <line x1="750" y1="400" x2="800" y2="360" marker-end="url(#ar)"/>
    <line x1="750" y1="470" x2="800" y2="460" marker-end="url(#ar)"/>
  </g>
  <text x="628" y="270" font-size="11" fill="#2c6fbb">3V3: VCC + STBY</text>

  <rect x="800" y="320" width="120" height="76" rx="6" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
  <text x="860" y="342" text-anchor="middle" font-weight="bold">IR array</text>
  <text x="860" y="358" text-anchor="middle" font-size="11">5x TCRT5000, 3.3 V</text>
  <text x="860" y="374" text-anchor="middle" font-size="11">out -> GPIO 34,35,</text>
  <text x="860" y="388" text-anchor="middle" font-size="11">32,33,25 (ADC)</text>

  <rect x="800" y="420" width="120" height="76" rx="6" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
  <text x="860" y="442" text-anchor="middle" font-weight="bold">Encoders x2</text>
  <text x="860" y="458" text-anchor="middle" font-size="11">3.3 V supply</text>
  <text x="860" y="474" text-anchor="middle" font-size="11">A/B -> 4 free GPIOs</text>
  <text x="860" y="488" text-anchor="middle" font-size="11">(e.g. 16-19)</text>

  <!-- ========== Signals (dashed gray) ========== -->
  <line x1="580" y1="370" x2="580" y2="170" stroke="#666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="572" y="255" text-anchor="end" font-size="11" fill="#444">6 control lines</text>
  <text x="572" y="269" text-anchor="end" font-size="11" fill="#444">PWMA AIN1 AIN2</text>
  <text x="572" y="283" text-anchor="end" font-size="11" fill="#444">PWMB BIN1 BIN2</text>

  <!-- ========== Ground ========== -->
  <g stroke="#000" stroke-width="3">
    <line x1="20" y1="580" x2="920" y2="580"/>
    <line x1="95" y1="330" x2="95" y2="580"/>
    <line x1="435" y1="470" x2="435" y2="580"/>
    <line x1="655" y1="500" x2="655" y2="580"/>
  </g>
  <text x="20" y="600" font-weight="bold">COMMON GND (single star point at battery -)</text>
  <text x="20" y="618" font-size="11">Battery -, buck GND, ESP32 GND, TB6612 GND, IR array GND, encoder GND and the 470 uF cap all join this one ground.</text>

  <!-- ========== Legend ========== -->
  <g font-size="11">
    <line x1="20" y1="50" x2="50" y2="50" stroke="#c0392b" stroke-width="3"/><text x="56" y="54">11.1 V (9.9-12.6 V) motor/battery rail</text>
    <line x1="20" y1="68" x2="50" y2="68" stroke="#e67e22" stroke-width="3"/><text x="56" y="72">5 V (ESP32 Vin)</text>
    <line x1="20" y1="86" x2="50" y2="86" stroke="#2c6fbb" stroke-width="3"/><text x="56" y="90">3.3 V (sensors, encoders, driver logic)</text>
    <line x1="20" y1="104" x2="50" y2="104" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/><text x="56" y="108">logic signals</text>
    <line x1="20" y1="122" x2="50" y2="122" stroke="#000" stroke-width="3"/><text x="56" y="126">ground</text>
  </g>
</svg>
