<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="780" height="540" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111">Example maze as a graph (not to scale)</text>
  <text x="20" y="44" font-size="11" fill="#444">Edge labels: length, then DFS step numbers "go / back". Green = shortest route by distance (130 cm).</text>

  <!-- corridors (gray) -->
  <g stroke="#d9d9d9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="70" y1="300" x2="190" y2="300"/>
    <line x1="190" y1="300" x2="190" y2="170"/>
    <line x1="190" y1="170" x2="190" y2="70"/>
    <line x1="190" y1="170" x2="340" y2="170"/>
    <line x1="340" y1="170" x2="340" y2="300"/>
    <line x1="340" y1="300" x2="500" y2="300"/>
    <path d="M190,300 L190,420 L340,420 L340,300"/>
  </g>

  <!-- loop edge A-D (orange dashed) -->
  <path d="M190,300 L190,420 L340,420 L340,300" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="8,5"/>

  <!-- optimal route (green): S-A-B-C-D-G -->
  <g stroke="#2e7d32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="70,300 190,300 190,170 340,170 340,300 500,300"/>
  </g>

  <!-- edge labels -->
  <g font-size="11" fill="#111">
    <text x="130" y="288" text-anchor="middle" font-weight="bold">20 cm</text>
    <text x="130" y="324" text-anchor="middle" fill="#555">1 / 14</text>

    <text x="174" y="236" text-anchor="end" font-weight="bold">30 cm</text>
    <text x="174" y="250" text-anchor="end" fill="#555">2 / 13</text>

    <text x="174" y="112" text-anchor="end" font-weight="bold">10 cm</text>
    <text x="174" y="126" text-anchor="end" fill="#555">3 / 4</text>

    <text x="265" y="154" text-anchor="middle" font-weight="bold">30 cm</text>
    <text x="265" y="196" text-anchor="middle" fill="#555">5 / 12</text>

    <text x="358" y="232" font-weight="bold">30 cm</text>
    <text x="358" y="246" fill="#555">6 / 11</text>

    <text x="420" y="284" text-anchor="middle" font-weight="bold">20 cm</text>
    <text x="420" y="326" text-anchor="middle" fill="#555">9 / 10</text>

    <text x="265" y="448" text-anchor="middle" font-weight="bold" fill="#c0680f">150 cm (long winding corridor)</text>
    <text x="265" y="464" text-anchor="middle" fill="#c0680f">7 / 8: probe, reaches known node A = loop edge</text>
  </g>

  <!-- replay turn tags -->
  <g font-size="11" font-weight="bold" fill="#2e7d32">
    <rect x="212" y="262" width="52" height="18" rx="9" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="238" y="275" text-anchor="middle">A: left</text>
    <rect x="206" y="128" width="58" height="18" rx="9" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="235" y="141" text-anchor="middle">B: right</text>
    <rect x="300" y="128" width="58" height="18" rx="9" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="329" y="141" text-anchor="middle">C: right</text>
    <rect x="354" y="258" width="52" height="18" rx="9" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="380" y="271" text-anchor="middle">D: left</text>
  </g>

  <!-- nodes -->
  <g stroke="#333" stroke-width="2" font-weight="bold" text-anchor="middle">
    <circle cx="70" cy="300" r="17" fill="#cfe8ff"/><text x="70" y="305" stroke="none" fill="#111">S</text>
    <circle cx="190" cy="300" r="17" fill="#ffffff"/><text x="190" y="305" stroke="none" fill="#111">A</text>
    <circle cx="190" cy="170" r="17" fill="#ffffff"/><text x="190" y="175" stroke="none" fill="#111">B</text>
    <circle cx="340" cy="170" r="17" fill="#ffffff"/><text x="340" y="175" stroke="none" fill="#111">C</text>
    <circle cx="340" cy="300" r="17" fill="#ffffff"/><text x="340" y="305" stroke="none" fill="#111">D</text>
    <circle cx="190" cy="70" r="17" fill="#ffd6d6"/><text x="190" y="75" stroke="none" fill="#111">E</text>
    <circle cx="500" cy="300" r="17" fill="#fff2b3"/><text x="500" y="305" stroke="none" fill="#111">G</text>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="338">start</text>
    <text x="190" y="38" fill="#b00020">dead end</text>
    <text x="500" y="338">goal</text>
    <text x="340" y="198" fill="#555" font-size="10">(corner)</text>
  </g>

  <!-- legend -->
  <rect x="520" y="380" width="245" height="140" rx="8" fill="#fafafa" stroke="#999"/>
  <g font-size="11" fill="#111">
    <line x1="532" y1="400" x2="562" y2="400" stroke="#d9d9d9" stroke-width="10" stroke-linecap="round"/><text x="572" y="404">corridor (edge)</text>
    <line x1="532" y1="422" x2="562" y2="422" stroke="#2e7d32" stroke-width="5"/><text x="572" y="426">shortest route, 130 cm</text>
    <line x1="532" y1="444" x2="562" y2="444" stroke="#e67e22" stroke-width="3" stroke-dasharray="6,4"/><text x="572" y="448">loop edge (back edge)</text>
    <text x="532" y="468">1 / 14 = DFS step going out / back</text>
    <text x="532" y="486">A: left = turn to take in the replay run</text>
    <text x="532" y="504">Circles = nodes (start, junction, dead end, goal)</text>
  </g>
</svg>
