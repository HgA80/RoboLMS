<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Arial, Helvetica, sans-serif" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
    <marker id="w" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e67e22"/></marker>
  </defs>
  <rect width="1120" height="360" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#111">Wireless sensor diagnostics - data flow (BLE)</text>

  <!-- background bands -->
  <rect x="10" y="40" width="780" height="210" rx="8" fill="#eef5ff" stroke="#2c6fbb" stroke-dasharray="5,4"/>
  <text x="20" y="58" font-weight="bold" fill="#2c6fbb">ESP32 on the robot (control loop on core 1, BLE stack on core 0)</text>
  <rect x="810" y="40" width="300" height="210" rx="8" fill="#eefaf0" stroke="#2e7d32" stroke-dasharray="5,4"/>
  <text x="820" y="58" font-weight="bold" fill="#2e7d32">Phone / PC (nothing touches the robot)</text>

  <!-- boxes: y 80..170 -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="20"  y="80" width="120" height="90" rx="6"/>
    <rect x="180" y="80" width="120" height="90" rx="6"/>
    <rect x="340" y="80" width="120" height="90" rx="6"/>
    <rect x="500" y="80" width="120" height="90" rx="6"/>
    <rect x="660" y="80" width="120" height="90" rx="6" stroke="#e67e22" stroke-width="2"/>
    <rect x="820" y="80" width="120" height="90" rx="6"/>
    <rect x="980" y="80" width="120" height="90" rx="6"/>
  </g>

  <g text-anchor="middle">
    <text x="80" y="100" font-weight="bold" font-size="12">1. IR sensors</text>
    <text x="80" y="118" font-size="10">5 analog outputs</text>
    <text x="80" y="132" font-size="10">raw 12-bit ADC</text>
    <text x="80" y="146" font-size="10">(before calibration)</text>

    <text x="240" y="100" font-weight="bold" font-size="12">2. Sample</text>
    <text x="240" y="118" font-size="10">same 100 Hz loop</text>
    <text x="240" y="132" font-size="10">as the PID; stamp</text>
    <text x="240" y="146" font-size="10">each frame (ms)</text>

    <text x="400" y="100" font-weight="bold" font-size="12">3. Health check</text>
    <text x="400" y="118" font-size="10">each sensor vs the</text>
    <text x="400" y="132" font-size="10">median of all five;</text>
    <text x="400" y="146" font-size="10">sets a fault bit</text>

    <text x="560" y="100" font-weight="bold" font-size="12">4. Pack + queue</text>
    <text x="560" y="118" font-size="10">16-byte binary</text>
    <text x="560" y="132" font-size="10">frame; non-blocking</text>
    <text x="560" y="146" font-size="10">queue, drop oldest</text>

    <text x="720" y="100" font-weight="bold" font-size="12">5. BLE notify</text>
    <text x="720" y="118" font-size="10">GATT service, one</text>
    <text x="720" y="132" font-size="10">notify characteristic,</text>
    <text x="720" y="146" font-size="10">7.5-15 ms interval</text>

    <text x="880" y="100" font-weight="bold" font-size="12">6. Client</text>
    <text x="880" y="118" font-size="10">Web Bluetooth page</text>
    <text x="880" y="132" font-size="10">(Chrome) or Python</text>
    <text x="880" y="146" font-size="10">script using bleak</text>

    <text x="1040" y="100" font-weight="bold" font-size="12">7. Display + log</text>
    <text x="1040" y="118" font-size="10">live 5-channel plot,</text>
    <text x="1040" y="132" font-size="10">fault indicators,</text>
    <text x="1040" y="146" font-size="10">CSV file for later</text>
  </g>

  <!-- arrows -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="140" y1="125" x2="180" y2="125" marker-end="url(#a)"/>
    <line x1="300" y1="125" x2="340" y2="125" marker-end="url(#a)"/>
    <line x1="460" y1="125" x2="500" y2="125" marker-end="url(#a)"/>
    <line x1="620" y1="125" x2="660" y2="125" marker-end="url(#a)"/>
    <line x1="940" y1="125" x2="980" y2="125" marker-end="url(#a)"/>
  </g>
  <line x1="780" y1="125" x2="820" y2="125" stroke="#e67e22" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#w)"/>
  <text x="800" y="112" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">radio</text>

  <!-- captions under each box -->
  <g text-anchor="middle" font-size="10" fill="#444">
    <text x="80" y="190">5 values</text>
    <text x="240" y="190">raw + calibrated</text>
    <text x="400" y="190">5 raw + fault bits</text>
    <text x="560" y="190">16 bytes</text>
    <text x="720" y="190">100 notifications/s</text>
    <text x="880" y="190">decode frames</text>
    <text x="1040" y="190">readable result</text>
  </g>

  <!-- data budget and design notes -->
  <rect x="10" y="262" width="1100" height="88" rx="8" fill="#fafafa" stroke="#999"/>
  <g font-size="11" fill="#111">
    <text x="22" y="282" font-weight="bold">Frame (16 bytes):</text>
    <text x="130" y="282">4 B time (ms) + 5 x 2 B raw readings + 1 B fault-bit mask + 1 B flags (line lost, bump event). Fits the default 20-byte BLE payload.</text>
    <text x="22" y="302" font-weight="bold">Data rate:</text>
    <text x="100" y="302">16 B x 100 Hz = 1.6 kB/s (about 13 kbit/s), well inside what BLE manages in practice.</text>
    <text x="22" y="322" font-weight="bold">Robustness:</text>
    <text x="106" y="322">timestamps come from the ESP32, so radio jitter does not matter; a sequence gap shows dropped frames; if the link drops the robot keeps driving.</text>
    <text x="22" y="342" font-weight="bold">Read-only:</text>
    <text x="96" y="342">diagnostics only observe: no recalibration, no stopping, no touching the hardware while the robot runs.</text>
  </g>
</svg>
